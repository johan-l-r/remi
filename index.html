<!DOCTYPE html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./styles/main.css">
		<title>remi</title>
	</head>
	<body>
		<form action="">
			<fieldset class="step step--active">
				<h2 class="step__title">Información General</h2>

				<div class="step__fields">
					<div class="collapsed">
						<div class="field">
							<label for="client">Cliente *</label>	
							<input type="text" id="client">
						</div>

						<div class="field">
							<label for="batch-name">Nombre del lote *</label>
							<input type="text" id="batch-name">
						</div>
					</div>

					<div class="field">
						<label for="reference">Referencia *</label>
						<input type="text" id="reference">
					</div>

					<div class="field">
						<label for="colors">Colores *</label>
						<input type="text" id="colors">

						<div class="list">

						</div>
					</div>
				</div>

				<div class="step__controls">
					<button class="button button--next button--main" type="button">Siguiente</button>
				</div>
			</fieldset>

			<fieldset class="step">
				<h2>Cantidades</h2>
				<div class="step__controls">
					<button class="button button--prev button--secondary" type="button">Anterior</button>
					<button class="button button--next button--main" type="button">Siguiente</button>
				</div>
			</fieldset>
		</form>

		<script src="./index.js" type="module"></script>
	</body>
</html>
