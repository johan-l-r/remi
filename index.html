<!DOCTYPE html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./styles/main.css">
		<title>remi</title>
	</head>
	<body>
		<form action="">
			<fieldset class="step step--active" data-step-index="0">
				<h2 class="step__title">Información General</h2>

				<div class="step__fields">
					<div class="collapsed">
						<div class="field">
							<label for="client">Cliente *</label>	
							<input 
								type="text" 
								placeholder="Nombre del cliente" 
								id="client"
								required
							>
						</div>

						<div class="field">
							<label for="batch-name">Nombre del lote *</label>
							<input 
								type="text" 
								placeholder="Ej. Camisa manga larga" 
								id="batch-name"
								required
							>
						</div>
					</div>

					<div class="field">
						<label for="reference">Referencia *</label>
						<input type="text" id="reference" required>
					</div>

					<div class="field">
						<label for="colors">Colores *</label>
						<input 
							type="text" 
							placeholder="Ej. Ivory" 
							id="colors"
							data-target-list="colors"
						>

						<ul class="list color-list">
						</ul>
					</div>
				</div>

				<div class="step__controls">
					<button class="button button--next button--main" type="button">Siguiente</button>
				</div>
			</fieldset>

			<fieldset class="step" data-step-index="1">
				<h2>Cantidades</h2>
				<div class="step__controls">
					<button class="button button--prev button--secondary" type="button">Anterior</button>
					<button class="button button--next button--main" type="button">Siguiente</button>
				</div>
			</fieldset>
		</form>

		<script src="./index.js" type="module"></script>
	</body>
</html>
